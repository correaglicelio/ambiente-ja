# Ambiente Já: atualiza os focos de calor todo dia e publica o site no GitHub Pages.
# Custo: zero (GitHub Actions e Pages são gratuitos para repositórios públicos).
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 11 * * *"   # todos os dias, 08:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]        # mudanças no site: só republica (não coleta)

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: ambiente-ja-coleta
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focos de calor (INPE)
        id: focos
        run: python scripts/coletar_focos.py --uf todas
        continue-on-error: true
      - name: Resumo da coleta
        if: always()
        run: |
          {
            echo "## Coleta de $(date -u +%d/%m/%Y)"
            echo "| Dados | Resultado |"
            echo "|---|---|"
            echo "| Focos de calor (INPE) | ${{ steps.focos.outcome }} |"
            echo ""
            echo "success = atualizado · failure = falhou (ficam os dados do dia anterior)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Salvar dados no repositório
        run: |
          git config user.name "ambiente-ja-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Dados atualizados em $(date -u +%d/%m/%Y)"
          git pull --rebase --strategy-option=theirs origin main || true
          git push

  publicar:
    needs: [coletar]
    if: always() && (needs.coletar.result == 'success' || needs.coletar.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: ambiente-ja-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/montar_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
